name: Android quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  anti-defense-audio-assets:
    name: Source defense sample bounds and finite WAV integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Verify original MP3 hashes and repeated PCM samples
        run: python3 -B -m unittest scripts.tests.test_prepare_anti_defense_audio -v

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Use preinstalled Android SDK and install compile packages
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "Preinstalled Android SDK manager not found at $sdkmanager" >&2
            exit 1
          fi
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$sdkmanager" --licenses
          set -o pipefail
          "$sdkmanager" 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Run Android lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Upload lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-lint-failure-reports
          path: app/build/reports/
          if-no-files-found: ignore

  android-platform-contract:
    name: Android-only platform contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Verify native Android project requirements
        run: python3 scripts/check_android_contract.py

  gameplay-platform-boundary:
    name: Game core platform boundary
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Verify simulation and AI remain platform independent
        run: python3 scripts/check_simulation_boundary.py

  ci-guard-tests:
    name: CI guard script tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Test gameplay boundary check failure cases
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py" -v

  neutral-button-artwork:
    name: Original button chrome has no baked action labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Check cached label-free chrome
        run: python3 -m unittest discover -s scripts/tests -p "test_neutral_button_art.py" -v
