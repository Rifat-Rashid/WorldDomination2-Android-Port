name: Android quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Android lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Use preinstalled Android SDK and install compile packages
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "Preinstalled Android SDK manager not found at $sdkmanager" >&2
            exit 1
          fi
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$sdkmanager" --licenses
          set -o pipefail
          "$sdkmanager" 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Run Android lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Upload lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-lint-failure-reports
          path: app/build/reports/
          if-no-files-found: ignore

  android-platform-contract:
    name: Android-only platform contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Verify native Android project requirements
        run: python3 scripts/check_android_contract.py
