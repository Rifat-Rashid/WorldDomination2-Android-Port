name: Android test suites

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  full-suite:
    name: JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Use preinstalled Android SDK and install compile packages
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "Preinstalled Android SDK manager not found at $sdkmanager" >&2
            exit 1
          fi
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$sdkmanager" --licenses
          set -o pipefail
          "$sdkmanager" 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Execute the complete debug JUnit suite
        id: junit
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Record report provenance
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.junit.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          output = Path('app/build/test-results/testDebugUnitTest')
          output.mkdir(parents=True, exist_ok=True)
          (output / 'provenance.json').write_text(json.dumps({
              'sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'outcome': os.environ['TEST_OUTCOME'],
              'reports': {p.relative_to(output).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                          for p in output.rglob('TEST-*.xml')},
          }))
          PY

      - name: Verify complete executed reports
        env:
          REPORT_SHA: ${{ github.sha }}
          REPORT_RUN: ${{ github.run_id }}
        run: python3 scripts/verify_test_partition.py app/build/test-results/testDebugUnitTest --task ':app:testDebugUnitTest' --sha "$REPORT_SHA" --run-id "$REPORT_RUN"

      - name: Publish executed JUnit reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: executed-debug-junit
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
          overwrite: true

  tests:
    needs: full-suite
    if: always()
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - id: source-panel-fling
            check: Source panel fling timing and uptime precision
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ui.PanelGestureVelocityTest"'
          - id: source-city-order-markers
            check: Source queued city target icons and selection precedence
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.BattlefieldCityOrderMarkersTest" --tests "com.example.worlddomination.game.assets.OriginalFlashAnimationAssetsTest.sourceCityOrderClipsAreOneFrameAndTheirShapesArePackaged" --tests "com.example.worlddomination.game.assets.OriginalFlashAnimationAssetsTest.cityOrderMarkerShapesUseEarlyAtlasWithoutDuplicateBattlePacking"'
          - id: source-action-instructions
            check: Source action instruction timing warnings and selection transitions
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ui.SourceActionInstructionTest"'
          - id: source-stock-controls
            check: Source equipment eligibility switch states and stock reservations
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ui.SourceStockControlStateTest" --tests "com.example.worlddomination.game.assets.StockControlArtworkTest"'
          - id: source-enemy-selection
            check: Source enemy removal artwork and responsive selection layout
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.assets.OriginalFlashAnimationAssetsTest.firstStageContainsEverySourcePortraitAndRemovalButNoMarkers" --tests "com.example.worlddomination.game.assets.OriginalFlashAnimationAssetsTest.setupRemovalButtonRetainsEmptyAndVisibleSourceFramesAndEarlyArtwork" --tests "com.example.worlddomination.game.ui.SetupScreenLayoutTest.removalArtworkKeepsSourceAspectRatioInsideEveryOccupiedCard"'
          - id: battlefield-city-selection
            check: Source city targeting colors ceasefires and ship restrictions
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.BattlefieldCitySelectionTest"'
          - id: source-city-hit-bounds
            check: Source city frame hit bounds and island touch mapping
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.CitySpriteHitGeometryTest"'
          - id: battlefield-terrain-parity
            check: Original terrain styles unused islands and conquest retention
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.BattlefieldTerrainStateTest" --tests "com.example.worlddomination.game.assets.BattlefieldTerrainAssetsTest"'
          - id: battlefield-flag-parity
            check: Source flag ownership colors and original waving artwork
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.BattlefieldFlagStateTest" --tests "com.example.worlddomination.game.assets.BattlefieldFlagAssetsTest" --tests "com.example.worlddomination.game.assets.OriginalFlashAnimationAssetsTest.flagPoleFamilyUsesEarlyAtlasWithoutDuplicateBattlePacking" --tests "com.example.worlddomination.game.assets.FlashSceneMetadataCacheTest"'
          - id: flash-mask-placement-tests
            check: Flash mask depths and exported artwork registration
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashSpriteQuadTest" --tests "com.example.worlddomination.game.rendering.FlashAnimationTimelineTest.diplomacyCoverageShapesRemainMasksAtEverySourceStyle" --tests "com.example.worlddomination.game.rendering.FlashAnimationTimelineTest.newNonMovePlacementResetsPriorMaskTransformNameAndAlpha" --tests "com.example.worlddomination.game.rendering.FlashAnimationTimelineTest.sourceAlphaAdditionIsInByteUnitsAndClampedAfterConversion"'
          - id: confirm-turn-animation-tests
            check: Original confirm opening closing and delayed turn input
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ui.ConfirmTurnAnimationTest" --tests "com.example.worlddomination.game.ui.ActionSlotAnimationTest"'
          - id: enemy-action-announcement-tests
            check: Enemy action scheme and original selection playback
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ui.TurnActionDisplayTest" --tests "com.example.worlddomination.game.rendering.TurnPlaybackArtworkTest" --tests "com.example.worlddomination.game.rendering.FlashActionBuildingAnimationTest.eachNationsSelectionRingPlaysThirtyFramesOnlyForItsAnnouncedAction"'
          - id: source-action-slot-parity
            check: Original fixed action slots and Skip Action parity
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.SourceActionSlotParityTest" --tests "com.example.worlddomination.game.ui.ActionSlotAnimationTest"'
          - id: technology-color-transform
            check: Original Technology color transforms and selected-list fields
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashCenterColorTest"'
          - id: economy-warning-parity
            check: Source economy warning dialogs and retained budgets
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ui.EconomyWarningStateTest"'
          - id: source-action-menu-tests
            check: Source diplomacy propaganda defense and attack menu transitions
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ui.SourceActionMenuStateTest" --tests "com.example.worlddomination.game.rendering.SourceActionMenuArtworkTest" --tests "com.example.worlddomination.game.ui.SourceEquipmentFlowParityTest"'
          - id: simulation-tests
            check: Gameplay simulation tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.*"'
          - id: source-rng-tests
            check: Seeded RNG parity tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.ReferenceRandomTest"'
          - id: ai-initialization-rng-tests
            check: AI initialization RNG parity tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateTest.emptySourceEnemySelectionStillConsumesItsRandomDraw" --tests "com.example.worlddomination.game.simulation.GameStateTest.aiDesireChoicesUseTheFirstValueOfSourceOneToTwoDraws"'
          - id: ai-two-pass-planning-tests
            check: AI two-pass source planning order
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ai.OpponentAITest.turnPlannerScoresEveryOpponentBeforePlanningAnyOpponent"'
          - id: ai-special-income-order-tests
            check: AI special income turn ordering
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateTest.specialLeaderIncomeIsAddedAfterAiPlanningBudgetSnapshot"'
          - id: ai-resource-score-tests
            check: AI resource score source formula
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ai.OpponentAITest.resourceScoreUsesSourceReserveFormulaAndStrictMoneyCutoff"'
          - id: ai-turn-upkeep-order-tests
            check: AI source turn-upkeep planning order
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateTest.aiPlanningReadsSpyReadinessCooldownAndRegardBeforeTurnResultUpkeep" --tests "com.example.worlddomination.game.simulation.GameStateTest.aiPlanningUsesReligionBeforeTurnResultDecay"'
          - id: ai-per-player-upkeep-tests
            check: AI per-player upkeep RNG and target timing
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateTest.upkeepRetargetsBeforeReligionDrawAndSkipsEliminatedPlayers" --tests "com.example.worlddomination.game.simulation.GameStateTest.targetEliminatedDuringResultPassIsRetargetedOnNextUpkeep"'
          - id: ai-production-budget-parity-tests
            check: AI production invalidates later source budget checks
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ai.OpponentAITest.productionInvalidatesSourceTurnBudgetBeforeSecondDiplomacyOffer" --tests "com.example.worlddomination.game.ai.OpponentAITest.diplomacyPopulationTiesKeepLastActivePlayerInSourceArrayOrder"'
          - id: ai-second-slot-retry-tests
