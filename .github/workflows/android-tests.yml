          - id: human-action-source-session-tests
            check: Mixed human action source session
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.HumanSourceActionSessionTest"'
          - id: ceasefire-result-clock-tests
            check: Ceasefire zero counter and defeat timing
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateTest.ceasefireRemainsActiveAtZeroUntilTheFollowingResultUpdate" --tests "com.example.worlddomination.game.simulation.GameStateTest.humanDefeatSkipsTheCeasefireResultCountdown"'
          - id: ai-turn-sixteen-source-trace-tests
