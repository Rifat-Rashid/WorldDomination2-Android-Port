            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateTest.sourceDifficultySetsStartingWeaponStockByPlayerAndDifficulty" --tests "com.example.worlddomination.game.simulation.GameStateTest.sourceDifficultyInitializesTechnologiesOnlyForActivePlayers"'
          - id: turn-progression-tests
