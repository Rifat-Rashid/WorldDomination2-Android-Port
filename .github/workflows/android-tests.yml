name: Android test suites

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - id: unit-tests
            check: JVM unit tests
            task: ':app:testDebugUnitTest'
          - id: simulation-tests
            check: Gameplay simulation tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.*"'
          - id: source-rng-tests
            check: Seeded RNG parity tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.ReferenceRandomTest"'
          - id: ai-initialization-rng-tests
            check: AI initialization RNG parity tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateTest.emptySourceEnemySelectionStillConsumesItsRandomDraw" --tests "com.example.worlddomination.game.simulation.GameStateTest.aiDesireChoicesUseTheFirstValueOfSourceOneToTwoDraws"'
          - id: ai-two-pass-planning-tests
            check: AI two-pass source planning order
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ai.OpponentAITest.turnPlannerScoresEveryOpponentBeforePlanningAnyOpponent"'
          - id: ai-special-income-order-tests
            check: AI special income turn ordering
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateTest.specialLeaderIncomeIsAddedAfterAiPlanningBudgetSnapshot"'
          - id: source-city-population-tests
            check: Source starting city population tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateTest.startingCityAllocationUsesFractionalQuarterAndConsumesFiveDraws" --tests "com.example.worlddomination.game.simulation.GameStateTest.inactivePlayerSlotsDoNotConsumeStartingCityPopulationDraws" --tests "com.example.worlddomination.game.simulation.GameStateTest.selectedOpponentSetupDistributesPopulationAcrossItsFiveCities"'
          - id: turn-progression-tests
            check: Game state and turn progression tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateTest"'
          - id: bioload-control-state-tests
            check: Bioload control state and expiry
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateTest.weaponBioloadStatusIsAvailableForInterfaceRendering" --tests "com.example.worlddomination.game.ai.OpponentAITest.biologicalStrikeBlocksHumanActionsAndRestoresTemporaryWeaponLocks"'
          - id: prepared-ship-map-tap-tests
            check: Prepared ship city-tap selection
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ui.PreparedShipStrikeSelectionTest"'
          - id: ai-bioload-action-filter-tests
            check: AI excludes bio-disabled action choices
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ai.OpponentAITest.plannerDoesNotFillSecondSlotFromBioDisabledActionScores" --tests "com.example.worlddomination.game.ai.OpponentAITest.plannerReturnsNoActionWhenEverySourceChoiceIsBioDisabled"'
          - id: noncombat-elimination-tests
            check: Noncombat zero-population elimination
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateTest.turnEndEliminatesZeroPopulationNationWithoutCombat"'
          - id: combat-event-tests
            check: Combat event resolution tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateCombatEventTest.resolvedSoldierAttackEmitsOneDirectAttackEvent" --tests "com.example.worlddomination.game.simulation.GameStateCombatEventTest.resolvedPreparedRocketAttackEmitsPayloadImpactEvent" --tests "com.example.worlddomination.game.simulation.GameStateCombatEventTest.shipStrikeEmitsAnImpactForEachResolvedPayload" --tests "com.example.worlddomination.game.simulation.GameStateCombatEventTest.attackThatBecomesUnavailableDoesNotEmitCombatEvent"'
          - id: prepared-rocket-slot-tests
            check: Prepared rocket launcher slot tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateCombatEventTest.resolvedPreparedRocketAttackEmitsPayloadImpactEvent"'
          - id: apache-building-slot-tests
            check: Apache action-building slot tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateCombatEventTest.directAttacksUseSourceUniqueBuildingOrderForApacheLaunchSlot" --tests "com.example.worlddomination.game.simulation.GameStateCombatEventTest.repeatedApacheAttacksReuseTheDeduplicatedHelipadSlot"'
          - id: spy-building-playback-tests
            check: Spy action-building source selection and assets
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateActionBuildingEventTest.resolvedSpyMissionUsesItsSelectedFlashBuilding" --tests "com.example.worlddomination.game.simulation.GameStateActionBuildingEventTest.unavailableSpyMissionDoesNotQueueAnActionBuilding" --tests "com.example.worlddomination.game.simulation.GameStateCombatEventTest.spyActionBuildingUsesSourceSpyCenterFrameWhenItsBuildingIsDuplicated" --tests "com.example.worlddomination.game.simulation.GameStateCombatEventTest.spyAndPreparedCarrierUseTheirSourceBuildingQueueSlots" --tests "com.example.worlddomination.game.assets.OriginalFlashAnimationAssetsTest.loadsOriginalSpyActionBuildingFramesReligionVariantsAndArt"'
          - id: combat-audio-mapping-tests
            check: Original combat audio mapping tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.audio.OriginalAudioTest.resolvedCombatEventsUseTheFlashUnitAndExplosionSoundMap" --tests "com.example.worlddomination.game.audio.OriginalAudioTest.combatCuesPointToTheOriginalPackagedSounds"'
          - id: setup-scoring-tests
            check: Game setup and scoring tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameSetupTest" --tests "com.example.worlddomination.game.simulation.FinalScoreBreakdownTest"'
          - id: setup-screen-tests
            check: Setup screen layout and rival selection
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ui.SetupScreenLayoutTest" --tests "com.example.worlddomination.game.simulation.GameSetupTest.removingASelectedOpponentSlotKeepsRemainingRivalsInDisplayOrder"'
          - id: setup-rng-stream-tests
            check: Setup selection RNG stream parity
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameSetupTest.seededSetupUsesSourceMenuDrawsAndNormalDifficulty" --tests "com.example.worlddomination.game.simulation.GameSetupTest.restartedSetupContinuesMenuRandomStreamIndependentOfMatchDraws"'
          - id: final-score-tests
            check: Final score breakdown tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.FinalScoreBreakdownTest"'
          - id: offline-high-score-tests
            check: Offline high score persistence
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.persistence.PersonalBestStoreTest"'
          - id: resources-economy-tests
            check: Resources and mass media economy tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateTest.normalResourcesAndMassMediaResolveOneTurn" --tests "com.example.worlddomination.game.simulation.GameStateTest.resourcesAndMassMediaAddTheirSourceHighscoreWeights" --tests "com.example.worlddomination.game.simulation.GameStateTest.resourceYieldUsesDifficultyDividerAndSourceRounding" --tests "com.example.worlddomination.game.simulation.GameStateTest.zeroHighscoreMultiplierDefaultsToOneLikeTheSource"'
          - id: technology-research-tests
            check: Technology research parity tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateTest.researchRequiresPrerequisiteAndReservesItsSourceCost" --tests "com.example.worlddomination.game.simulation.GameStateTest.researchCompletesAndActivatesTheCorrespondingWeapon" --tests "com.example.worlddomination.game.simulation.GameStateTest.specialTechnologiesUnlockAfterFourLevelFourTechnologies" --tests "com.example.worlddomination.game.simulation.GameStateTest.researchSelectsMultipleGroupsReservesCombinedCostAndCompletesThem"'
          - id: production-budget-tests
            check: Production budget and stock tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateTest.productionReservesBudgetAndTurnsItIntoWeaponStock" --tests "com.example.worlddomination.game.simulation.GameStateTest.productionRejectsLockedTechnologyGroupAndKeepsExistingSelection" --tests "com.example.worlddomination.game.simulation.GameStateTest.productionCanSplitOneHundredPercentAcrossMultipleCategories" --tests "com.example.worlddomination.game.simulation.GameStateTest.productionAllocationCannotExceedSharedHundredPercentLimit" --tests "com.example.worlddomination.game.simulation.GameStateTest.productionReservationRoundsCombinedShareAndRefundsOnRemoval" --tests "com.example.worlddomination.game.simulation.GameStateTest.productionActionReservesAndResolvesEveryAllocatedCategory" --tests "com.example.worlddomination.game.simulation.GameStateTest.researchThenProductionUsesUnlockedUnitAndSourceCostOrder"'
          - id: ai-production-zero-category-tests
            check: AI production category-zero source parity
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ai.OpponentAITest.sourceEmptyCategoryZeroCanConsumeTheOnlyProductionSlot"'
          - id: direct-combat-tests
            check: Direct combat and casualty tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateTest.directSoldierAttackConsumesStockAndDamagesSelectedCity" --tests "com.example.worlddomination.game.simulation.GameStateTest.directAttackChangesMutualRegardAndFractionalCeasefireAllyRegard" --tests "com.example.worlddomination.game.simulation.GameStateTest.directAttackRejectsDeadTargetsEmptyCitiesAndUnavailableWeapons" --tests "com.example.worlddomination.game.simulation.GameStateTest.soldierCasualtyRollFloorsSourceRandRangeBeforeRounding"'
          - id: intelligence-tests
            check: Spy and intelligence gameplay tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateTest.spyAttackStealsMoneyAndStockThenFollowsReadinessCooldown" --tests "com.example.worlddomination.game.simulation.GameStateTest.queuedSpyMissionResolvesWithoutRecheckingReadiness" --tests "com.example.worlddomination.game.simulation.GameStateTest.spyStealsTechnologyWithoutRemovingEnemyUnitStock" --tests "com.example.worlddomination.game.simulation.GameStateTest.spyTargetsPopulatedCityAndDifficultyCapsStolenFunds" --tests "com.example.worlddomination.game.simulation.GameStateTest.spyCannotSelectAnEmptyCityEvenWhenTheNationStillHasPopulation" --tests "com.example.worlddomination.game.simulation.GameStateTest.specialOpponentUsesDifficultyMoneyCapAndOneLowLevelItem"'
          - id: prepared-weapon-defense-tests
            check: Prepared weapons and defense tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateTest.queuedDefenseReservesCounterStockUntilTheOrderIsRemoved" --tests "com.example.worlddomination.game.simulation.GameStateTest.queuedCarrierAndPayloadReservePreparedStrikeStock" --tests "com.example.worlddomination.game.simulation.GameStateTest.queuedShipStrikeReservesEverySelectedPayload" --tests "com.example.worlddomination.game.simulation.GameStateTest.rocketStrikeConsumesCarrierWhenPreparedAndPayloadWhenLaunched" --tests "com.example.worlddomination.game.simulation.GameStateTest.preparedShipRequiresThreeSameNationPayloadCityPairsAndResolvesEach" --tests "com.example.worlddomination.game.simulation.GameStateTest.defenseSelectionConsumesOneMatchingCounter" --tests "com.example.worlddomination.game.simulation.GameStateTest.carrierCounterMappingsAndPayloadLevelsMatchWeaponStock" --tests "com.example.worlddomination.game.simulation.GameStateTest.counterInterceptRuleBlocksEightOfNineSourceRolls"'
          - id: propaganda-population-tests
            check: Propaganda and population tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateTest.propagandaTransfersSourceCalculatedCitizensFromChosenCity" --tests "com.example.worlddomination.game.simulation.GameStateTest.combatAndPropagandaUseTheUnchangedTurnStartPopulation" --tests "com.example.worlddomination.game.simulation.GameStateTest.propagandaUsesBattleCasualtiesEvenWhenAttackIsQueuedAfterIt" --tests "com.example.worlddomination.game.simulation.GameStateTest.propagandaDamagesMutualRegardAndMovesThirdPartyRegardFractionally" --tests "com.example.worlddomination.game.simulation.GameStateTest.propagandaHonorsReligionCapAndRejectsInvalidTargets" --tests "com.example.worlddomination.game.simulation.GameStateTest.propagandaUsesStrictPopulationThresholdsAndHumanReligionCap"'
          - id: diplomacy-relations-tests
            check: Diplomacy and relations tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateTest.diplomacyOptionsMatchReferenceTableAndReserveOfferFunds" --tests "com.example.worlddomination.game.simulation.GameStateTest.diplomacyOfferIsResolvedByAiAndCreatesTimedSymmetricCeasefire" --tests "com.example.worlddomination.game.simulation.GameStateTest.diplomacyRegardDriftAddsDifficultyBonusOnlyToAiRivalRelations" --tests "com.example.worlddomination.game.simulation.GameStateTest.diplomacyDriftSkipsDeadActorsButUpdatesRelationsTowardThem" --tests "com.example.worlddomination.game.simulation.GameStateTest.rejectedDiplomacyOfferRefundsItsFullCost" --tests "com.example.worlddomination.game.simulation.GameStateTest.diplomacyDemandUsesAiAcceptanceRulesAndTransfersMoney" --tests "com.example.worlddomination.game.simulation.GameStateTest.humanCanRespondToAiOfferAndDemandProposals" --tests "com.example.worlddomination.game.simulation.GameStateTest.diplomacyProposalCooldownBelongsToProposerAndTicksAtTurnStart" --tests "com.example.worlddomination.game.simulation.GameStateTest.acceptedAiOfferSettlesAfterTheRecipientPlansItsTurn"'
          - id: ai-tests
            check: Opponent AI tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ai.*"'
          - id: ai-research-turn-cap-tests
            check: AI research turn cap parity
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ai.OpponentAITest.researchTurnBonusStopsGrowingAtTheSourceSixtyTurnCap"'
          - id: ai-diplomacy-target-score-tests
            check: AI diplomacy source score selection
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ai.OpponentAITest.diplomacyTargetScoreUsesStrictGreaterAndKeepsFirstRivalOnTies"'
          - id: ai-diplomacy-cooldown-tests
            check: AI diplomacy cooldown RNG parity
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ai.OpponentAITest.diplomacyCooldownTargetsDoNotConsumeRandomCandidateDraws"'
          - id: ai-source-strength-tests
            check: AI source strength calculation
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ai.OpponentAITest.sourceStrengthCountsTechnologyCombatStockAndFundsButNotCounters"'
          - id: ai-counter-strength-tests
            check: Defense counters excluded from AI strength
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ai.OpponentAITest.sourceStrengthDoesNotChangeWhenCounterStockChanges"'
          - id: ai-planning-matrix
            check: AI planning scenario matrix
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ai.AiPlanningScenarioMatrixTest"'
          - id: ui-tests
            check: Touch and presentation tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ui.*"'
          - id: setup-screen-layout-tests
            check: Setup screen responsive layout
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ui.SetupScreenLayoutTest"'
          - id: setup-leader-selection-tests
            check: Setup leader selection behavior
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameSetupTest.selectingCarouselLeaderChangesCandidateWithoutChangingOpponentRoster" --tests "com.example.worlddomination.game.simulation.GameSetupTest.selectingCarouselLeaderRejectsIdsOutsideOriginalRoster"'
          - id: setup-source-artwork-tests
            check: Original setup portrait and building artwork
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashAnimationTimelineTest.setupPortraitTimelineContainsEverySelectableOriginalLeaderPortrait" --tests "com.example.worlddomination.game.assets.OriginalCityAssetsTest"'
          - id: scroll-pane-tests
            check: Independent panel scrolling tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ui.ScrollPaneStateTest"'
          - id: scroll-render-demand-tests
            check: Scroll momentum render demand
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ui.ScrollPaneStateTest.flingMotionEndsWhenItReachesTheScrollBoundary"'
          - id: render-loop-policy-tests
            check: Idle and animated render loop policy
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.RenderLoopPolicyTest"'
          - id: battlefield-layout-tests
            check: Battlefield layout tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ui.BattlefieldCityLayoutTest"'
          - id: city-rendering-tests
            check: Battlefield city art and ruin-frame tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.assets.OriginalCityAssetsTest" --tests "com.example.worlddomination.game.rendering.CitySpriteLayoutTest" --tests "com.example.worlddomination.game.simulation.CityStateTest" --tests "com.example.worlddomination.game.simulation.GameStateTest.laterActionStillResolvesWhenEarlierAttackWillEliminateTargetCity"'
          - id: city-state-tests
            check: City population and destruction state tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.CityStateTest"'
          - id: city-shrink-sequence-tests
            check: City shrink animation sequence tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.CityShrinkSequenceTest"'
          - id: city-animation-render-demand-tests
            check: City animation render demand
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.CityShrinkSequenceTest.animationActivityIsReportedUntilTheFinalSourceTick"'
          - id: source-animation-tests
            check: Source animation timeline tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashAnimationTimelineTest" --tests "com.example.worlddomination.game.rendering.SourceCombatAnimationMappingTest"'
          - id: rocket-source-art-tests
            check: Original rocket and trail artwork tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashAnimationTimelineTest.rocketAndTrailUseThePackagedFlashTimelinesAndNestedSourceArtwork" --tests "com.example.worlddomination.game.audio.OriginalAudioTest.combatCuesPointToTheOriginalPackagedSounds"'
          - id: submarine-rocket-route-tests
            check: Submarine rocket route parity
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashBattleRoutesTest.createsSourceSubmarineRocketEllipseForEveryTargetCity" --tests "com.example.worlddomination.game.rendering.FlashBattleRoutesTest.rejectsInvalidSubmarineRocketRoutePlayerAndCity"'
          - id: submarine-rocket-playback-tests
            check: Submarine rocket playback parity
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashRocketAnimationTest.submarineRocketWaitsForTheSourceLaunchAndUsesHalfHeightArtwork" --tests "com.example.worlddomination.game.simulation.GameStateCombatEventTest.resolvedPreparedSubmarineAttackEmitsAPlayablePayloadImpact"'
          - id: flash-vector-shape-tests
            check: Original Flash vector shape artwork tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashAnimationTimelineTest.smokePuffFlashShapeIsPackagedAsVectorArtForNativeRasterization"'
          - id: source-battle-route-tests
            check: Source soldier battle route tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashBattleRoutesTest.sourceBattleAnchorsIncludeAllSoldierWaypoints" --tests "com.example.worlddomination.game.rendering.FlashBattleRoutesTest.createsBoatAndThreeInfantryRoutesForEveryTargetCity" --tests "com.example.worlddomination.game.rendering.FlashBattleRoutesTest.rejectsInvalidPlayersCitiesAndMissingSourceAnchors"'
          - id: apache-marine-route-tests
            check: Apache and marine route tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashBattleRoutesTest.createsApacheAndThreeMarineRoutesForEveryTargetCityAndActionSlot" --tests "com.example.worlddomination.game.rendering.FlashBattleRoutesTest.actionBuildingSlotsMatchTheOriginalFlashSceneCoordinates" --tests "com.example.worlddomination.game.rendering.FlashBattleRoutesTest.rejectsInvalidApacheSlot"'
          - id: source-battle-playback-tests
            check: Source soldier battle playback tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashSoldierOneAnimationTest"'
          - id: apache-marine-playback-tests
            check: Apache and marine playback tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashApacheMarineAnimationTest" --tests "com.example.worlddomination.game.rendering.FlashAnimationTimelineTest.packagedStrikeAndInterceptionSymbolsMatchSourceTimelines" --tests "com.example.worlddomination.game.simulation.GameStateCombatEventTest.marineDirectAttackUsesTheOriginalSealGunCue"'
          - id: combat-animation-mapping-tests
            check: Combat event animation mapping tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.SourceCombatAnimationMappingTest"'
          - id: suicide-bomber-route-tests
            check: Suicide bomber source route tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashBattleRoutesTest.createsSourceSuicideBomberRoutesForEveryAttackerTargetAndCity" --tests "com.example.worlddomination.game.rendering.FlashBattleRoutesTest.rejectsInvalidSuicideBomberRouteData" --tests "com.example.worlddomination.game.rendering.FlashBattleRoutesTest.suicideBomberLaunchPositionUsesItsSourceActionBuildingSlot"'
          - id: suicide-bomber-playback-tests
            check: Suicide bomber playback tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashSuicideBomberAnimationTest" --tests "com.example.worlddomination.game.rendering.FlashAnimationTimelineTest.packagedStrikeAndInterceptionSymbolsMatchSourceTimelines" --tests "com.example.worlddomination.game.simulation.GameStateCombatEventTest.suicideBomberAttackUsesTheHatchSlotAndOriginalScreamCue"'
          - id: chinook-tank-route-tests
            check: Chinook and tank source route tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashBattleRoutesTest.createsChinookAndTankRoutesForEveryPlayerCityAndActionSlot" --tests "com.example.worlddomination.game.rendering.FlashBattleRoutesTest.rejectsInvalidChinookTankRouteData"'
          - id: rocket-route-tests
            check: Prepared rocket source route tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashBattleRoutesTest.createsSourceRocketEllipseFromEverySiloAndTargetCity" --tests "com.example.worlddomination.game.rendering.FlashBattleRoutesTest.rejectsInvalidRocketRoutePlayerCityAndSiloSlot" --tests "com.example.worlddomination.game.rendering.FlashBattleRoutesTest.rocketStageXBlendsBetweenTheAttackerAndTargetIslandCrops"'
          - id: rocket-flight-tests
            check: Rocket flight and impact playback tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashRocketAnimationTest"'
          - id: satellite-route-tests
            check: Satellite launch route parity
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashBattleRoutesTest.satelliteRouteUsesSourceLaunchAndOrbitDataForEveryIslandAndCity" --tests "com.example.worlddomination.game.rendering.FlashBattleRoutesTest.satelliteRouteRejectsUnknownReligionAndInvalidBattlefieldAddresses"'
          - id: satellite-playback-tests
            check: Satellite flight and laser timing
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashSatelliteAnimationTest" --tests "com.example.worlddomination.game.simulation.GameStateTest.spaceLaunchCountsSatelliteAndTerminalScoreIncludesSourceFlagBonus"'
          - id: satellite-source-art-tests
            check: Nested satellite art and audio mapping
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.assets.OriginalFlashAnimationAssetsTest" --tests "com.example.worlddomination.game.rendering.FlashAnimationTimelineTest.satelliteFlashLabelsSelectTheFiveOriginalReligionFrames" --tests "com.example.worlddomination.game.rendering.FlashAnimationTimelineTest.satelliteReligionClipsLoadTheirAnimatedBodyAndLaserAnchorFrames" --tests "com.example.worlddomination.game.rendering.FlashBattleUnitRendererTest" --tests "com.example.worlddomination.game.rendering.SourceCombatAnimationMappingTest.allWarheadAndBioloadLevelsUseTheirOriginalSymbols" --tests "com.example.worlddomination.game.audio.OriginalAudioTest.combatCuesPointToTheOriginalPackagedSounds"'
          - id: submarine-source-art-tests
            check: Submarine source clips and atlas assets
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.assets.OriginalFlashAnimationAssetsTest.loadsOriginalSubmarineHullAndTintTimelinesIntoBattleAtlas"'
          - id: submarine-launch-timing-tests
            check: Submarine launch frame timing and route pans
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashSubmarineAnimationTest" --tests "com.example.worlddomination.game.rendering.FlashBattleRoutesTest.createsSourceSubmarineRocketEllipseForEveryTargetCity" --tests "com.example.worlddomination.game.rendering.FlashBattleRoutesTest.marksInterceptedSubmarineRocketAndUsesTheOriginalHighExplosionPoint" --tests "com.example.worlddomination.game.rendering.FlashBattleRoutesTest.recognizesSubmarineImpactAndInterceptionEventsOnly" --tests "com.example.worlddomination.game.simulation.GameStateCombatEventTest.resolvedPreparedSubmarineAttackEmitsAPlayablePayloadImpact"'
          - id: submarine-tint-audio-tests
            check: Submarine player tint and splash audio
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashColorTransformTest" --tests "com.example.worlddomination.game.audio.OriginalAudioTest.submarineSurfacingUsesTheOriginalWaterSplashCue"'
          - id: chinook-tank-playback-tests
            check: Chinook and tank source playback tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashChinookTankAnimationTest" --tests "com.example.worlddomination.game.rendering.FlashSpriteTransformTest" --tests "com.example.worlddomination.game.rendering.FlashAnimationTimelineTest.packagedStrikeAndInterceptionSymbolsMatchSourceTimelines" --tests "com.example.worlddomination.game.simulation.GameSetupTest.sourcePlayerColorIdsMapToTankTurretLibraryNames" --tests "com.example.worlddomination.game.simulation.GameStateCombatEventTest.tankDirectAttackUsesItsSourceSlotAndChinookSound" --tests "com.example.worlddomination.game.audio.OriginalAudioTest.tankBattleCuesUseTheRecoveredOriginalSounds"'
          - id: sprite-transform-tests
            check: Flash sprite transform tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashSpriteTransformTest"'
          - id: presentation-rng-isolation-tests
            check: Presentation RNG isolation tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.ReferenceRandomTest.copiedRandomPreservesTheStreamWithoutAdvancingCanonicalState"'
          - id: match-outcome-tests
            check: Match outcome sequence tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ui.MatchOutcomeSequenceTest" --tests "com.example.worlddomination.game.ui.MatchOutcomePresentationTest"'
          - id: outcome-render-demand-tests
            check: Outcome animation render demand
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ui.MatchOutcomeSequenceTest.outcomeActivityEndsOnlyAfterTheScoreSequenceCompletes"'
          - id: asset-audio-tests
            check: Asset and audio integrity tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.assets.*" --tests "com.example.worlddomination.game.audio.*" --tests "com.example.worlddomination.ExampleUnitTest"'
          - id: original-ui-manifest-tests
            check: Original UI asset manifest tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.assets.OriginalUiAssetManifestTest"'
          - id: anti-air-animation-tests
            check: Anti-defense tracking and firing cadence
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashAntiDefenseTrackingAnimationTest"'
          - id: anti-air-counter-event-tests
            check: Anti-air counter event metadata
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateCombatEventTest.antiAirCounterRetainsItsActionBuildingSlotOnAirStrikeOutcomes"'
          - id: anti-air-art-tests
            check: Original anti-air Flash turret artwork
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.assets.OriginalFlashAnimationAssetsTest.loadsOriginalReligionSpecificAntiAirFramesIntoTheBattleAtlas" --tests "com.example.worlddomination.game.rendering.FlashAnimationTimelineTest.antiAirTrackingTimelineContainsOriginalDirectionalTurretArtwork"'
          - id: anti-air-audio-tests
            check: Original anti-air sound assets
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.audio.OriginalAudioTest.antiDefenseTrackingCuesUseTheOriginalPackagedSounds" --tests "com.example.worlddomination.game.audio.OriginalAudioTest.everyMappedCueIsAnOriginalGzipWrappedMp3Asset"'
          - id: anti-rocket-playback-tests
            check: Anti-rocket target playback and shot cadence
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashAntiDefenseTrackingAnimationTest.antiRocketUsesItsOriginalOneShotCueOnTheAlternatingFireFrame" --tests "com.example.worlddomination.game.rendering.FlashRocketAnimationTest.siloRocketExposesItsMovingTargetPositionForAntiRocketTracking"'
          - id: anti-rocket-counter-event-tests
            check: Anti-rocket counter events and source building slots
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateCombatEventTest.antiRocketCounterRetainsItsActionBuildingSlotOnRocketOutcomes" --tests "com.example.worlddomination.game.simulation.GameStateCombatEventTest.antiRocketRetainsTheSecondSourceDefenseBuildingSlot"'
          - id: anti-defense-building-frame-tests
            check: Anti-air and anti-rocket source building frames
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateCombatEventTest.antiDefenseActionsUseTheirDistinctSourceBuildingFrames"'
          - id: anti-rocket-art-tests
            check: Anti-rocket uses original directional Flash turret art
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.assets.OriginalFlashAnimationAssetsTest.loadsOriginalReligionSpecificAntiAirFramesIntoTheBattleAtlas" --tests "com.example.worlddomination.game.rendering.FlashAnimationTimelineTest.antiAirTrackingTimelineContainsOriginalDirectionalTurretArtwork"'
          - id: anti-rocket-audio-tests
            check: Anti-rocket uses original one-shot firing audio
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.audio.OriginalAudioTest.antiDefenseTrackingCuesUseTheOriginalPackagedSounds" --tests "com.example.worlddomination.game.audio.OriginalAudioTest.everyMappedCueIsAnOriginalGzipWrappedMp3Asset" --tests "com.example.worlddomination.game.rendering.FlashAnimationTimelineTest.antiRocketFireSoundRunsForThirtyTwoSourceTicks"'
          - id: action-building-playback-tests
            check: Original Flash action-building playback
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.GameStateActionBuildingEventTest" --tests "com.example.worlddomination.game.simulation.GameStateCombatEventTest" --tests "com.example.worlddomination.game.rendering.FlashActionBuildingAnimationTest" --tests "com.example.worlddomination.game.assets.OriginalFlashAnimationAssetsTest.loadsOriginalActionBuildingFramesAndReligionVariantsIntoTheBattleAtlas"'
          - id: turn-playback-sequence-tests
            check: Source action-label timing and turn playback barrier
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.TurnPlaybackSequenceTest"'
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Use preinstalled Android SDK and install compile packages
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "Preinstalled Android SDK manager not found at $sdkmanager" >&2
            exit 1
          fi
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$sdkmanager" --licenses
          set -o pipefail
          "$sdkmanager" 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Run ${{ matrix.check }}
        run: ./gradlew --no-daemon --stacktrace ${{ matrix.task }}

      - name: Verify ${{ matrix.check }} ran tests
        run: python3 scripts/verify_junit_results.py app/build/test-results/testDebugUnitTest

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-${{ matrix.id }}-failure-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
