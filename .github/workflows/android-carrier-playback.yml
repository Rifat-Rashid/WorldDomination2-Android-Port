name: Android aircraft playback checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  aircraft-tests:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: carrier-route
            check: Carrier strike route parity
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashBattleRoutesTest.createsThreeSourceCarrierPlaneRoutesForEveryPlayerAndCity" --tests "com.example.worlddomination.game.rendering.FlashBattleRoutesTest.carrierPlaneRouteMarksInterceptionsAndRejectsInvalidInputs" --tests "com.example.worlddomination.game.simulation.GameStateCombatEventTest.shipStrikeEmitsAnImpactForEachResolvedPayload"'
          - id: carrier-playback
            check: Carrier aircraft playback parity
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashCarrierPlaneAnimationTest"'
          - id: carrier-assets
            check: Carrier Flash artwork and audio integrity
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashAnimationTimelineTest.carrierAircraftUsesItsPackaged24FrameFlashTimelineAndShapes" --tests "com.example.worlddomination.game.audio.OriginalAudioTest.carrierAircraftCuesUseTheRecoveredOriginalTakeoffAndFlightSounds"'
          - id: airfield-plane-routes
            check: Airfield aircraft route and event parity
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashBattleRoutesTest.standalonePlaneRoutesMatchAirfieldOrbitAndFlashLinkagesForAllIslands" --tests "com.example.worlddomination.game.rendering.FlashBattleRoutesTest.standalonePlaneInterceptionTargetsCityAndRejectsInvalidLaunchData" --tests "com.example.worlddomination.game.simulation.GameStateCombatEventTest.resolvedPreparedAircraftAttackCarriesItsAirfieldSlotForNativePlayback"'
          - id: airfield-plane-playback
            check: Airfield aircraft source-tick playback
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.rendering.FlashStandalonePlaneAnimationTest"'
          - id: airfield-plane-artwork-audio
            check: Airfield aircraft Flash artwork and audio
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.assets.OriginalFlashAnimationAssetsTest.loadsOriginalStandaloneAircraftFramesTintAndShadows" --tests "com.example.worlddomination.game.audio.OriginalAudioTest.standaloneAircraftCuesUseTheRecoveredFighterAndCarrierJetSounds" --tests "com.example.worlddomination.game.rendering.FlashAffineTransformTest"'
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Use preinstalled Android SDK and install compile packages
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "Preinstalled Android SDK manager not found at $sdkmanager" >&2
            exit 1
          fi
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$sdkmanager" --licenses
          set -o pipefail
          "$sdkmanager" 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Run ${{ matrix.check }}
        run: ./gradlew --no-daemon --stacktrace ${{ matrix.task }}

      - name: Verify ${{ matrix.check }} ran tests
        run: python3 scripts/verify_junit_results.py app/build/test-results/testDebugUnitTest

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-${{ matrix.id }}-failure-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
