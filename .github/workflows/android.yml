name: Android validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Build, unit tests, and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK and install compile packages
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "Preinstalled Android SDK manager not found at $sdkmanager" >&2
            exit 1
          fi
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$sdkmanager" --licenses
          set -o pipefail
          "$sdkmanager" 'platform-tools' 'platforms;android-37' 'build-tools;36.0.0'

      - name: Resolve dependencies, build, test, and lint
        run: ./gradlew --no-daemon --stacktrace :app:dependencies :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Upload validation reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: android-validation-failure-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
