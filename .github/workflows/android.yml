name: Android validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-resolution:
    name: Gradle dependency resolution
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Resolve Android module dependencies
        run: >-
          ./gradlew --no-daemon --stacktrace :app:dependencies
          --configuration debugRuntimeClasspath

  android:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: assemble
            check: Android debug assembly
            task: ':app:assembleDebug'
          - id: unit-tests
            check: Full JVM unit test suite
            task: ':app:testDebugUnitTest'
          - id: simulation-tests
            check: Gameplay simulation tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.*"'
          - id: ai-tests
            check: Opponent AI tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ai.*"'
          - id: ui-tests
            check: Touch and presentation tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ui.*"'
          - id: asset-audio-tests
            check: Asset and audio integrity tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.assets.*" --tests "com.example.worlddomination.game.audio.*" --tests "com.example.worlddomination.ExampleUnitTest"'
          - id: lint
            check: Android lint
            task: ':app:lintDebug'
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Use preinstalled Android SDK and install compile packages
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "Preinstalled Android SDK manager not found at $sdkmanager" >&2
            exit 1
          fi
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$sdkmanager" --licenses
          set -o pipefail
          "$sdkmanager" 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Run ${{ matrix.check }}
        run: ./gradlew --no-daemon --stacktrace ${{ matrix.task }}

      - name: Upload debug APK for package validation
        if: ${{ success() && matrix.id == 'assemble' }}
        uses: actions/upload-artifact@v6
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload validation reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-${{ matrix.id }}-failure-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  package-integrity:
    name: APK asset and native library integrity
    needs: android
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Download assembled debug APK
        uses: actions/download-artifact@v6
        with:
          name: android-debug-apk
          path: artifacts

      - name: Verify packaged original audio and Android native libraries
        run: >-
          python3 scripts/verify_android_apk.py
          artifacts/app-debug.apk
          app/src/main/assets/original/runtime/audio
