name: Android validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: assemble
            check: Android debug assembly
            task: ':app:dependencies :app:assembleDebug'
          - id: unit-tests
            check: Full JVM unit test suite
            task: ':app:testDebugUnitTest'
          - id: simulation-tests
            check: Gameplay simulation tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.simulation.*"'
          - id: ai-tests
            check: Opponent AI tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ai.*"'
          - id: ui-tests
            check: Touch and presentation tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.ui.*"'
          - id: asset-audio-tests
            check: Asset and audio integrity tests
            task: ':app:testDebugUnitTest --tests "com.example.worlddomination.game.assets.*" --tests "com.example.worlddomination.game.audio.*" --tests "com.example.worlddomination.ExampleUnitTest"'
          - id: lint
            check: Android lint
            task: ':app:lintDebug'
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Use preinstalled Android SDK and install compile packages
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "Preinstalled Android SDK manager not found at $sdkmanager" >&2
            exit 1
          fi
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$sdkmanager" --licenses
          set -o pipefail
          "$sdkmanager" 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Run ${{ matrix.check }}
        run: ./gradlew --no-daemon --stacktrace ${{ matrix.task }}

      - name: Verify original audio files in the APK
        if: ${{ matrix.id == 'assemble' }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          apk_path = Path('app/build/outputs/apk/debug/app-debug.apk')
          audio_dir = Path('app/src/main/assets/original/runtime/audio')
          audio_sources = sorted(audio_dir.glob('*.mp3.gz'))
          if not audio_sources:
              raise SystemExit('No original compressed MP3 sources were found')

          with ZipFile(apk_path) as apk:
              for source in audio_sources:
                  packaged = 'assets/' + source.relative_to('app/src/main/assets').as_posix()[:-3]
                  try:
                      data = apk.read(packaged)
                  except KeyError as error:
                      raise SystemExit(f'Missing packaged audio asset: {packaged}') from error
                  mpeg_sync = len(data) >= 2 and data[0] == 0xff and data[1] & 0xe0 == 0xe0
                  if not (data.startswith(b'ID3') or mpeg_sync):
                      raise SystemExit(f'Packaged audio is not MP3 data: {packaged}')
          print(f'Verified {len(audio_sources)} packaged original MP3 assets')
          PY

      - name: Upload validation reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-${{ matrix.id }}-failure-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
