name: WD2 local AI tools
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  mcp:
    name: MCP protocol and game tools
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/wd2ai/requirements-mcp.txt
      - shell: pwsh
        run: ./tools/wd2play/play.ps1 -Command build
      - run: python -m unittest discover -s tools/wd2ai -p "test_*.py"
