name: Android beta release validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-build:
    name: Beta release bundle, release tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install compile SDK using preinstalled tools
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses
          set -o pipefail
          "$sdkmanager" 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build and test the real release variant without upload credentials
        run: ./gradlew --no-daemon --stacktrace :app:bundleRelease :app:testReleaseUnitTest :app:lintRelease
      - name: Verify release JUnit reports
        run: python3 scripts/verify_junit_results.py app/build/test-results/testReleaseUnitTest
      - name: Retain unsigned bundle for packaging verification
        uses: actions/upload-artifact@v6
        with:
          name: beta-release-bundle-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
      - name: Preserve release diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: beta-release-failure-reports
          path: app/build/reports/

  bundle-integrity:
    name: Release bundle structure, offline assets, and 16 KB natives
    needs: release-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v7
        with:
          name: beta-release-bundle-unsigned
          path: artifacts
      - name: Download checksum-pinned official bundletool
        run: |
          curl --fail --location --retry 3 -o bundletool.jar https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  bundletool.jar' | sha256sum --check
      - name: Validate bundle and export its compiled manifest
        run: |
          java -jar bundletool.jar validate --bundle=artifacts/app-release.aab > artifacts/bundle-validation.txt
          java -jar bundletool.jar dump manifest --bundle=artifacts/app-release.aab > artifacts/manifest.xml
          java -jar bundletool.jar dump config --bundle=artifacts/app-release.aab > artifacts/bundle-config.json
      - name: Verify release identity, packaged latest UI, audio, and ELF page alignment
        run: |
          python3 scripts/verify_android_bundle.py artifacts/app-release.aab --manifest artifacts/manifest.xml
          python3 -c 'import json; c=json.load(open("artifacts/bundle-config.json")); assert c["optimizations"]["uncompressNativeLibraries"]["alignment"] == "PAGE_ALIGNMENT_16K"'
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: beta-bundle-validation
          path: |
            artifacts/*.txt
            artifacts/*.xml
            artifacts/*.json

  native-shards:
    name: Android native regression group ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [a, b]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate native test inventory and select this group
        id: inventory
        run: python3 -B scripts/native_test_groups.py --group '${{ matrix.group }}' --github-output "$GITHUB_OUTPUT"
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute native renderer tests on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            bash scripts/run_android_native_tests.sh '${{ steps.inventory.outputs.classes }}' ${{ steps.inventory.outputs.evidence }}
      - name: Preserve this Android group's results and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-native-${{ matrix.group }}-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: error

  native-mask-tests:
    # Keep the existing required check; it succeeds only after both groups pass.
    name: Android GLES mask and drawing-state regression tests
    needs: native-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download every native group without overwriting device XML
        uses: actions/download-artifact@v7
        with:
          pattern: android-native-*-results
          path: native-artifacts
          merge-multiple: false
      - name: Require successful groups and complete executed evidence
        env:
          NATIVE_RESULT: ${{ needs.native-shards.result }}
        run: |
          if [[ "$NATIVE_RESULT" != success ]]; then
            echo "Native test groups did not all succeed: $NATIVE_RESULT" >&2
            exit 1
          fi
          python3 -B scripts/native_test_groups.py --artifacts native-artifacts
      - name: Preserve combined Android test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-gles-mask-results
          path: native-artifacts/
          if-no-files-found: error
