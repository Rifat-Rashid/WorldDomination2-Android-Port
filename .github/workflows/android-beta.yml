name: Android beta release validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-build:
    name: Beta release bundle, release tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install compile SDK using preinstalled tools
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses
          set -o pipefail
          "$sdkmanager" 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build and test the real release variant without upload credentials
        run: ./gradlew --no-daemon --stacktrace :app:bundleRelease :app:testReleaseUnitTest :app:lintRelease
      - name: Verify release JUnit reports
        run: python3 scripts/verify_junit_results.py app/build/test-results/testReleaseUnitTest
      - name: Retain unsigned bundle for packaging verification
        uses: actions/upload-artifact@v6
        with:
          name: beta-release-bundle-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
      - name: Preserve release diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: beta-release-failure-reports
          path: app/build/reports/

  bundle-integrity:
    name: Release bundle structure, offline assets, and 16 KB natives
    needs: release-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v7
        with:
          name: beta-release-bundle-unsigned
          path: artifacts
      - name: Download checksum-pinned official bundletool
        run: |
          curl --fail --location --retry 3 -o bundletool.jar https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  bundletool.jar' | sha256sum --check
      - name: Validate bundle and export its compiled manifest
        run: |
          java -jar bundletool.jar validate --bundle=artifacts/app-release.aab > artifacts/bundle-validation.txt
          java -jar bundletool.jar dump manifest --bundle=artifacts/app-release.aab > artifacts/manifest.xml
          java -jar bundletool.jar dump config --bundle=artifacts/app-release.aab > artifacts/bundle-config.json
      - name: Verify release identity, packaged latest UI, audio, and ELF page alignment
        run: |
          python3 scripts/verify_android_bundle.py artifacts/app-release.aab --manifest artifacts/manifest.xml
          python3 -c 'import json; c=json.load(open("artifacts/bundle-config.json")); assert c["optimizations"]["uncompressNativeLibraries"]["alignment"] == "PAGE_ALIGNMENT_16K"'
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: beta-bundle-validation
          path: |
            artifacts/*.txt
            artifacts/*.xml
            artifacts/*.json

  native-mask-tests:
    name: Android GLES mask and drawing-state regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute native renderer tests on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            bash scripts/run_android_native_tests.sh com.example.worlddomination.testing.GameActivityScenarioInstrumentedTest,com.example.worlddomination.game.assets.EarlySetupPortraitsInstrumentedTest,com.example.worlddomination.game.rendering.FlashAtlasContextRecoveryInstrumentedTest,com.example.worlddomination.game.rendering.SourceCityOrderMarkersInstrumentedTest,com.example.worlddomination.game.rendering.SourceActionInstructionsInstrumentedTest,com.example.worlddomination.game.rendering.StockControlsInstrumentedTest,com.example.worlddomination.game.rendering.SetupEnemySelectionInstrumentedTest,com.example.worlddomination.game.rendering.FlashStencilMasksInstrumentedTest,com.example.worlddomination.game.rendering.TurnControlsInstrumentedTest,com.example.worlddomination.game.rendering.ActionSlotsInstrumentedTest,com.example.worlddomination.game.rendering.TechnologyUiInstrumentedTest,com.example.worlddomination.game.rendering.BattlefieldFlagsInstrumentedTest,com.example.worlddomination.game.rendering.BattlefieldTerrainInstrumentedTest,com.example.worlddomination.game.rendering.BattlefieldCitySelectionInstrumentedTest,com.example.worlddomination.game.rendering.SourceCityHitBoundsInstrumentedTest,com.example.worlddomination.game.rendering.CitySelectionAudioInstrumentedTest,com.example.worlddomination.game.rendering.IndependentPanelGesturesInstrumentedTest,com.example.worlddomination.game.rendering.EconomyWarningsInstrumentedTest,com.example.worlddomination.game.rendering.SourceActionMenusInstrumentedTest,com.example.worlddomination.game.rendering.HumanDiplomacyResponseInstrumentedTest,com.example.worlddomination.game.rendering.CarrierSortieInstrumentedTest,com.example.worlddomination.game.rendering.ChinookDeploymentArtInstrumentedTest,com.example.worlddomination.game.rendering.SourceBattleRecordClockInstrumentedTest,com.example.worlddomination.game.rendering.SourceBattleCleanupInstrumentedTest,com.example.worlddomination.game.rendering.InfantryRenderingInstrumentedTest,com.example.worlddomination.game.rendering.SatelliteRenderingInstrumentedTest,com.example.worlddomination.game.rendering.SatelliteTurnPlaybackInstrumentedTest,com.example.worlddomination.game.rendering.SatelliteAudioInstrumentedTest,com.example.worlddomination.game.rendering.SourceBattleDepthsInstrumentedTest,com.example.worlddomination.game.rendering.SourceBattleDepthRenderingInstrumentedTest,com.example.worlddomination.game.rendering.SourceInfantryDepthsInstrumentedTest,com.example.worlddomination.game.rendering.SourceInfantryDepthRenderingInstrumentedTest,com.example.worlddomination.game.rendering.SourceChinookDepthsInstrumentedTest,com.example.worlddomination.game.rendering.SourceChinookDepthRenderingInstrumentedTest,com.example.worlddomination.game.rendering.SourceSuicideDepthsInstrumentedTest,com.example.worlddomination.game.rendering.SourceSuicideDepthRenderingInstrumentedTest,com.example.worlddomination.game.rendering.SourceSuicideAudioInstrumentedTest,com.example.worlddomination.game.rendering.SourceBattlePhaseIsolationInstrumentedTest,com.example.worlddomination.game.rendering.SourceBattlePhaseRenderingInstrumentedTest,com.example.worlddomination.game.rendering.SourceBattleReentryInstrumentedTest,com.example.worlddomination.game.rendering.SourceBiologicalPlaybackInstrumentedTest,com.example.worlddomination.game.rendering.SourceBiologicalCarriersInstrumentedTest,com.example.worlddomination.game.rendering.SourceInterceptedAircraftInstrumentedTest,com.example.worlddomination.game.rendering.SourceBiologicalRenderingInstrumentedTest,com.example.worlddomination.game.rendering.SourceBiologicalAudioInstrumentedTest,com.example.worlddomination.game.rendering.ApacheTurnPlaybackInstrumentedTest,com.example.worlddomination.game.rendering.ApacheRenderingInstrumentedTest,com.example.worlddomination.game.rendering.MassMediaValueLayoutInstrumentedTest,com.example.worlddomination.game.rendering.SourceEndgameInstrumentedTest,com.example.worlddomination.game.rendering.SourceEndgameContextRecoveryInstrumentedTest,com.example.worlddomination.game.ui.PropagandaUiInstrumentedTest
      - name: Preserve Android test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-gles-mask-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
